namespace: axion-dev

database:
  postgresUser: axion_user
  postgresPassword: Admin@1234
  postgresDbName: axion_db
  port: 5432

deployment:
  replicas: 1
  labels:
    app: telemetry

container:
  name: telemetry-container
  port: 8000

image:
  repository: rishi7211/telemetry
  tag: "v1"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"

  limits:
    cpu: "500m"
    memory: "512Mi"


service:
 
  selector:
    app: telemetry

  port: 80
  targetPort: 8000

  type: ClusterIP


hpa:
  enabled: true

  minReplicas: 1
  maxReplicas: 5

  targetCPUUtilizationPercentage: 70

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telemetry-deploy



ingress:
  enabled: true

  ingressClassName: azure-application-gateway

  annotations:
    appgw.ingress.kubernetes.io/health-probe-path: "/dashboard/summary"

  host: telemetry.theakkc.space

  path: "/"
  pathType: Prefix



